[package]
name = "avatar-adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
avatar-audio-graph = { version = "0.1.0", path = "../avatar-audio-graph" }
avatar-conversation = { version = "0.1.0", path = "../libraries/avatar-conversation" }
avatar-doctor = { version = "0.1.0", path = "../libraries/avatar-doctor" }
avatar-holder = { version = "0.1.0", path = "../libraries/avatar-holder" }
avatar-listening = { version = "0.1.0", path = "../avatar-listening" }
avatar-live = { version = "0.1.0", path = "../avatar-live" }
avatar-wake = { version = "0.1.0", path = "../libraries/avatar-wake" }
jiff = { workspace = true, features = ["tz-system"] }
nix.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
avatar-floor = { version = "0.1.0", path = "../libraries/avatar-floor" }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
