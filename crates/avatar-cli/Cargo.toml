[package]
name = "avatar-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "avatar"
path = "src/main.rs"

[dependencies]
avatar-assets = { version = "0.1.0", path = "../libraries/avatar-assets" }
avatar-adapters = { version = "0.1.0", path = "../avatar-adapters" }
avatar-audio-graph = { version = "0.1.0", path = "../avatar-audio-graph" }
avatar-control = { version = "0.1.0", path = "../avatar-control" }
avatar-conversation = { version = "0.1.0", path = "../libraries/avatar-conversation" }
avatar-doctor = { version = "0.1.0", path = "../libraries/avatar-doctor" }
avatar-holder = { version = "0.1.0", path = "../libraries/avatar-holder" }
avatar-live = { version = "0.1.0", path = "../avatar-live" }
avatar-mac = { version = "0.1.0", path = "../avatar-mac" }
avatar-listening = { version = "0.1.0", path = "../avatar-listening" }
avatar-floor = { version = "0.1.0", path = "../libraries/avatar-floor" }
avatar-room-audio = { version = "0.1.0", path = "../libraries/avatar-room-audio" }
avatar-routing = { version = "0.1.0", path = "../libraries/avatar-routing" }
avatar-seat = { version = "0.1.0", path = "../avatar-seat" }
avatar-transcript = { version = "0.1.0", path = "../libraries/avatar-transcript" }
avatar-transcription = { version = "0.1.0", path = "../avatar-transcription" }
avatar-wake = { version = "0.1.0", path = "../libraries/avatar-wake" }
clap.workspace = true
futures-util.workspace = true
jiff = { workspace = true, features = ["tz-system"] }
nix = { workspace = true, features = ["user"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
