[advisories]
version = 2
ignore = [{ id = "RUSTSEC-2026-0319", reason = "anymap2 is reached only through the tract-linalg build script templating; no replacement release exists" }]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "Zlib", "ISC", "Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
