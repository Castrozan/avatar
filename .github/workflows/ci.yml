name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run nix flake check
        run: nix flake check -L

  rust-gates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run the Rust gates
        run: nix develop -c scripts/check
      - name: Compare the Rust routing with the Python routing
        run: >-
          nix develop -c sh -c 'cargo build -p avatar-routing &&
          cd runtime &&
          AVATAR_ROUTING_BINARY="$PWD/../target/debug/avatar-routing"
          python -m pytest __tests__/unit/routing_differential -p no:cacheprovider'
