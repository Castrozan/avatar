[pytest]
addopts = -ra --strict-markers --strict-config -p no:cacheprovider
    --deselect=runtime/__tests__/unit/seat/meeting_page/test_call_audio_drivers.py::test_drivers_already_in_place_leave_the_audio_server_alone
    --deselect=runtime/__tests__/unit/seat/meeting_page/test_call_audio_drivers.py::test_a_changed_driver_replaces_the_installed_one
    --deselect=runtime/__tests__/unit/seat/test_remote_talk_seat_rule.py::test_a_meeting_seat_is_found_by_the_holder_told_it_holds_a_meeting
xfail_strict = true
python_files = test_*.py
pythonpath = tests/doubles
testpaths =
    runtime/__tests__/unit
    skills/avatar/__tests__/unit
    skills/avatar/scripts/browser/__tests__/unit
    tests/unit
filterwarnings =
    error
